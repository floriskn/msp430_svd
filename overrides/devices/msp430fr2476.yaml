  - "../peripherals/pmmctl0_svshe_enum.yaml"
  - "../peripherals/frctl.yaml"
  - "../peripherals/wdt_a_wdtpw_enum.yaml"
  - "../peripherals/sys_frwppw_enum.yaml"
  - "../peripherals/crc.yaml"
