SYS:
  SYSSNIV:
    SYSSNIV:
      _replace_enum:
        NONE: [0, "No interrupt pending"]
        SVSLIFG: [2, "SVS low-power reset entry"]
        UBDIFG: [4, "Uncorrectable FRAM bit error detection"]
        ACCTEIFG: [6, "FRAM Access Time Error"]
        SYSSNIV_8: [8, "Reserved"]
        SYSSNIV_10: [10, "Reserved"]
        SYSSNIV_12: [12, "Reserved"]
        SYSSNIV_14: [14, "Reserved"]
        SYSSNIV_16: [16, "Reserved"]
        VMAIFG: [18, "VMAIFG Vacant memory access"]
        JMBINIFG: [20, "JMBINIFG JTAG mailbox input"]
        JMBOUTIFG: [22, "JMBOUTIFG JTAG mailbox output"]
        CBDIFG: [24, "Correctable FRAM bit error detection"]

"_INTERRUPTS":
  _modify:
    _interrupts:
      ECOMP0:
          value: 37
      PORT6:
          value: 38
      PORT5:
          value: 39
      PORT4:
          value: 40
      PORT3:
          value: 41
      PORT2:
          value: 42
      PORT1:
          value: 43
      ADC:
          value: 44
      EUSCI_B1:
          value: 45
      EUSCI_B0:
          value: 46
      EUSCI_A1:
          value: 47
      EUSCI_A0:
          value: 48
      WDT:
          value: 49
      RTC:
          value: 50
      TIMER0_B1:
          value: 51
      TIMER0_B0:
          value: 52
      TIMER3_A1:
          value: 53
      TIMER3_A0:
          value: 54
      TIMER2_A1:
          value: 55
      TIMER2_A0:
          value: 56
      TIMER1_A1:
          value: 57
      TIMER1_A0:
          value: 58
      TIMER0_A1:
          value: 59
      TIMER0_A0:
          value: 60
      UNMI:
          value: 61
      SYSNMI:
          value: 62

# The LPM3.5 switch is only on other devices (LPM5SM, LPM5SW: "Only available in the FR203x, FR211x, FR2100,
# FR2000, FR231x, FR2433, FR2422, FR263x, FR253x, FR252x, and FR413x devices", SLAU445I Table 2-7), and
# FRLPMPWR "always reads as 0 after reset" on devices not in that list (SLAU445I Table 6-3). On an
# MSP430FR2476 neither LPM5SM nor FRLPMPWR can be set.
PMM:
  PM5CTL0:
    _delete:
      - LPM5SM
      - LPM5SW

FRCTL:
  GCCTL0:
    _modify:
      FRLPMPWR:
        access: read-only
